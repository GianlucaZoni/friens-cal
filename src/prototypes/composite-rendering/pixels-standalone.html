<!doctype html>
<meta charset="utf-8" />
<title>pixel check</title>
<style>
  body { font: 11px/1.3 -apple-system, sans-serif; margin: 0; }
  .pane { padding: 14px 16px; }
  .light { background: #fff; color: #171717; --border: #e5e5e5; --card: #fff; }
  .dark  { background: #0a0a0a; color: #fafafa; --border: #ffffff1a; --card: #1a1a1a; }
  .row { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 14px; }
  .colwrap { width: 118px; }
  .colwrap h4 { margin: 0 0 4px; font-size: 10px; font-weight: 600; opacity: .8; }
  .col { position: relative; border: 1px solid var(--border); background: var(--card); border-radius: 6px;
         background-image: repeating-linear-gradient(to bottom, var(--border) 0 1px, transparent 1px 48px); }
  .blk { position: absolute; left: 2px; right: 2px; border-radius: 5px; overflow: hidden;
         box-shadow: inset 0 0 0 1px #00000010; }
  .fill { position: absolute; inset: 0; }
  .cell { position: relative; width: 78px; height: 72px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--card); }
  h3 { margin: 16px 0 6px; font-size: 11px; opacity: .6; text-transform: uppercase; letter-spacing: .05em; }
</style>
<div id="out"></div>
<script>
const TONES = [[0.2,{l:.86,c:.085}],[0.36,{l:.9,c:.028}],[0.62,{l:.73,c:.135}],[0.8,{l:.62,c:.165}],[0.93,{l:.87,c:.16}],[1.0,{l:.34,c:.035}]];
const ramp = t => (TONES.reduce((b,x)=>Math.abs(x[0]-t)<Math.abs(b[0]-t)?x:b))[1];
const colr = (f,a) => { const {l,c}=ramp(f.tone); return `oklch(${l} ${c} ${f.hue} / ${a})` };
function hash2(a,b){let h=Math.imul(a^0x9e3779b9,0x85ebca6b)^Math.imul(b+0x165667b1,0xc2b2ae35);h=Math.imul(h^(h>>>13),0x27d4eb2f);return ((h^(h>>>16))>>>0)/4294967296}

const VIEWER={id:0,name:'You',hue:305,tone:.62};
const OTHERS=[
 {id:1,name:'Marco',hue:28,tone:.8},{id:2,name:'Sara',hue:152,tone:.62},
 {id:3,name:'Giulia',hue:262,tone:.62},{id:4,name:'Luca',hue:268,tone:.62},
 {id:5,name:'Elena',hue:92,tone:.36},{id:6,name:'Dario',hue:200,tone:.8},
 {id:7,name:'Nadia',hue:340,tone:.93},{id:8,name:'Teo',hue:62,tone:1.0}];
const byId=id=>[VIEWER,...OTHERS].find(f=>f.id===id);
const A=[[1,18*60,22*60],[2,20*60,23*60],[3,19*60,21*60],[4,19*60+30,23*60],[5,17*60,20*60],[6,20*60+30,24*60],[7,18*60,19*60],[8,21*60,23*60+30]];

function segments(rs){const p=new Set();rs.forEach(r=>{p.add(r[1]);p.add(r[2])});const s=[...p].sort((a,b)=>a-b);const out=[];
 for(let i=0;i<s.length-1;i++){const st=s[i],en=s[i+1];const ids=rs.filter(r=>r[1]<=st&&r[2]>=en).map(r=>r[0]).sort((a,b)=>a-b);if(ids.length)out.push({start:st,end:en,ids})}
 return out}
function runs(sg){const rs=[];for(const s of sg){const l=rs[rs.length-1];if(l&&l.end===s.start){l.end=s.end;l.segs.push(s)}else rs.push({start:s.start,end:s.end,segs:[s]})}return rs}

function meshBg(ids,seed,boost){const fs=ids.map(byId);
 const layers=fs.map(f=>{const x=6+hash2(seed,f.id)*88,y=6+hash2(f.id,seed+7)*88;
   return `radial-gradient(130% 85% at ${x}% ${y}%, ${colr(f,.42*boost)} 0%, ${colr(f,0)} 72%)`});
 layers.push(`linear-gradient(115deg, ${fs.map(f=>colr(f,.16*boost)).join(', ')})`);
 return layers.join(', ')}
function stripeBg(ids,boost){const fs=ids.map(byId),st=100/fs.length;
 return `linear-gradient(102deg, ${fs.map((f,i)=>`${colr(f,.55*boost)} ${i*st}% ${(i+1)*st}%`).join(', ')})`}
function blurEl(ids,seed,dark){const d=document.createElement('span');d.className='fill';d.style.isolation='isolate';
 ids.map(byId).forEach(f=>{const x=8+hash2(seed,f.id)*84,y=8+hash2(f.id,seed+7)*84;const s=document.createElement('span');
  s.style.cssText=`position:absolute;border-radius:999px;left:${x}%;top:${y}%;width:78%;height:120%;transform:translate(-50%,-50%);background:${colr(f,.75)};filter:blur(9px);mix-blend-mode:${dark?'screen':'multiply'}`;d.appendChild(s)});
 return d}

const P0=17*60, PH=24, py=m=>((m-P0)/30)*PH, H=py(24*60);
function fillEl(ids,seed,tech,dark,boost=1){
 if(tech==='blur')return blurEl(ids,seed,dark);
 const s=document.createElement('span');s.className='fill';
 s.style.backgroundImage = tech==='stripes'?stripeBg(ids,boost):meshBg(ids,seed,boost);return s}

function colEl(title,kind,ids,tech,dark){
 const w=document.createElement('div');w.className='colwrap';w.innerHTML=`<h4>${title}</h4>`;
 const c=document.createElement('div');c.className='col';c.style.height=H+'px';w.appendChild(c);
 const rs=A.filter(r=>ids.includes(r[0]));const sg=segments(rs);
 if(kind==='A'||kind==='D'){sg.forEach((s,i)=>{const b=document.createElement('div');b.className='blk';
   b.style.top=py(s.start)+'px';b.style.height=Math.max(3,py(s.end)-py(s.start)-2)+'px';
   if(kind==='A')b.appendChild(fillEl(s.ids,i*17,tech,dark));
   else{const a=.1+.62*(s.ids.length/Math.max(1,ids.length));b.style.background=dark?`oklch(0.82 0.03 265 / ${a})`:`oklch(0.48 0.04 265 / ${a})`;
     const sp=document.createElement('div');sp.style.cssText='position:absolute;inset:0 auto 0 0;width:5px;display:flex;flex-direction:column';
     s.ids.forEach(id=>{const t=document.createElement('div');t.style.cssText=`height:${100/s.ids.length}%;background:${colr(byId(id),.95)}`;sp.appendChild(t)});b.appendChild(sp)}
   c.appendChild(b)})}
 if(kind==='B'){runs(sg).forEach((r,ri)=>{const b=document.createElement('div');b.className='blk';
   b.style.top=py(r.start)+'px';b.style.height=Math.max(3,py(r.end)-py(r.start)-2)+'px';
   r.segs.forEach((s,i)=>{const tf=i>0?11:0,bf=i<r.segs.length-1?11:0;
     const m=`linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgb(0,0,0) ${tf}px, rgb(0,0,0) calc(100% - ${bf}px), rgba(0,0,0,0) 100%)`;
     const d=document.createElement('div');d.style.cssText=`position:absolute;left:0;right:0;top:${py(s.start)-py(r.start)-tf}px;height:${py(s.end)-py(s.start)+tf+bf}px;-webkit-mask-image:${m};mask-image:${m}`;
     d.appendChild(fillEl(s.ids,ri*7+i,tech,dark));b.appendChild(d)});
   c.appendChild(b)})}
 if(kind==='C'){ids.forEach((id,li)=>{const w2=100/ids.length;A.filter(r=>r[0]===id).forEach(r=>{const b=document.createElement('div');
   b.style.cssText=`position:absolute;border-radius:3px;left:calc(${li*w2}% + 1px);width:calc(${w2}% - 2px);top:${py(r[1])}px;height:${Math.max(3,py(r[2])-py(r[1])-2)}px;background:${colr(byId(id),.62)}`;c.appendChild(b)})})}
 // viewer solid 19:00-22:00, 14px rail on the right
 if(kind!=='C'){const b=document.createElement('div');
  b.style.cssText=`position:absolute;left:2px;right:14px;top:${py(19*60)}px;height:${py(22*60)-py(19*60)-2}px;border-radius:5px;background:${colr(VIEWER,.92)};box-shadow:inset 0 0 0 1px #00000022`;
  b.innerHTML='<span style="position:absolute;left:5px;top:2px;font-size:9px;color:#ffffffdd">you</span>';c.appendChild(b)}
 return w}

function monthCell(ids,kind,dark,tech){
 const c=document.createElement('div');c.className='cell';
 const rs=A.filter(r=>ids.includes(r[0]));const sg=segments(rs);
 const sc=m=>((m-P0)/(7*60))*72;
 if(kind==='A')sg.forEach((s,i)=>{const b=document.createElement('div');
   b.style.cssText=`position:absolute;left:2px;right:2px;top:${sc(s.start)}px;height:${Math.max(2,sc(s.end)-sc(s.start)-1)}px;border-radius:3px;overflow:hidden`;
   b.appendChild(fillEl(s.ids,i*17,tech,dark));c.appendChild(b)});
 if(kind==='B'){const all=[...new Set(sg.flatMap(s=>s.ids))];const f=fillEl(all,13,tech,dark,.85);c.appendChild(f);
   const strip=document.createElement('div');strip.style.cssText='position:absolute;left:0;right:0;bottom:0;height:7px';
   runs(sg).forEach((r,i)=>{const d=document.createElement('div');d.style.cssText=`position:absolute;top:0;height:100%;left:${sc(r.start)/72*100}%;width:${(sc(r.end)-sc(r.start))/72*100}%;overflow:hidden`;
     d.appendChild(fillEl([...new Set(r.segs.flatMap(s=>s.ids))],i*31,tech,dark,2));strip.appendChild(d)});c.appendChild(strip)}
 if(kind==='C'){const free=[...new Set(rs.map(r=>r[0]))];const w=document.createElement('div');
   w.style.cssText='position:absolute;left:4px;right:4px;bottom:4px;display:flex;flex-wrap:wrap;gap:2px;align-content:flex-end';
   free.forEach(id=>{const s=document.createElement('span');s.style.cssText=`width:14px;height:14px;border-radius:999px;background:${colr(byId(id),1)}`;w.appendChild(s)});c.appendChild(w)}
 if(kind==='D'){const peak=Math.max(...sg.map(s=>s.ids.length));const a=.1+.62*(peak/Math.max(1,ids.length));
   c.style.background=dark?`oklch(0.82 0.03 265 / ${a})`:`oklch(0.48 0.04 265 / ${a})`;
   c.innerHTML=`<div style="position:absolute;left:4px;top:2px;font-size:13px;font-weight:600">${peak}</div>`;
   const strip=document.createElement('div');strip.style.cssText='position:absolute;left:0;right:0;bottom:0;height:8px;display:flex';
   sg.forEach(s=>{const d=document.createElement('div');d.style.cssText=`position:absolute;bottom:0;height:100%;display:flex;flex-direction:column-reverse;left:${sc(s.start)/72*100}%;width:${Math.max(2,(sc(s.end)-sc(s.start))/72*100)}%`;
     s.ids.forEach(id=>{const t=document.createElement('div');t.style.cssText=`height:${100/s.ids.length}%;background:${colr(byId(id),.95)}`;d.appendChild(t)});strip.appendChild(d)});c.appendChild(strip)}
 return c}

const out=document.getElementById('out');
for(const dark of [false,true]){
 const pane=document.createElement('div');pane.className='pane '+(dark?'dark':'light');
 for(const n of [2,4,8]){
   pane.insertAdjacentHTML('beforeend',`<h3>${dark?'dark':'light'} · ${n} visible Friends · mesh</h3>`);
   const row=document.createElement('div');row.className='row';
   const ids=OTHERS.slice(0,n).map(f=>f.id);
   [['A segmented','A'],['B continuous','B'],['C lanes','C'],['D density','D']].forEach(([t,k])=>row.appendChild(colEl(t,k,ids,'mesh',dark)));
   pane.appendChild(row)}
 pane.insertAdjacentHTML('beforeend',`<h3>${dark?'dark':'light'} · technique, 6 friends, variant A</h3>`);
 const r2=document.createElement('div');r2.className='row';const ids6=OTHERS.slice(0,6).map(f=>f.id);
 ['mesh','stripes','blur'].forEach(t=>r2.appendChild(colEl(t,'A',ids6,t,dark)));
 r2.appendChild(colEl('B mesh 6','B',ids6,'mesh',dark));
 pane.appendChild(r2);
 pane.insertAdjacentHTML('beforeend',`<h3>${dark?'dark':'light'} · month cells, 6 friends (A / B / C / D)</h3>`);
 const r3=document.createElement('div');r3.className='row';
 ['A','B','C','D'].forEach(k=>r3.appendChild(monthCell(ids6,k,dark,'mesh')));
 pane.appendChild(r3);
 out.appendChild(pane)}
</script>
