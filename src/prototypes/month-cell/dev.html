    <title>Prototype 14 — month cell</title>

    <script type="module">
      import '/src/index.css'

      import MonthCellPrototype from '/src/prototypes/month-cell/index.tsx'

      createRoot(document.getElementById('root')).render(
        createElement(StrictMode, null, createElement(MonthCellPrototype)),
