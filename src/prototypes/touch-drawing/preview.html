<!doctype html>
<!--
  PROTOTYPE — ticket 10: drawing Availability by touch. THROWAWAY.

  Dependency-free twin of index.tsx / grid.tsx. Same time model, same three
  gesture variants, same instrumentation. Open it on a phone (or in devtools
  with touch emulation) — no build step.

  The whole point of this file is the ONE conflict: a draw gesture and a scroll
  gesture live on the same surface. The log at the bottom prints, for every
  gesture, whether the browser scrolled or the app drew, and why.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Prototype 10 — touch drawing</title>
    <style>
      *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html,body{ margin:0; height:100%; }
      body{
        font: 13px/1.4 Inter, system-ui, -apple-system, sans-serif; color:#111; background:#fff;
        display:flex; flex-direction:column; overscroll-behavior:none;
        --mine: oklch(0.58 0.17 258);
        --mine-soft: oklch(0.58 0.17 258 / 1);
      }

      /* ---- variant switcher: TOP, not bottom. The bottom belongs to the
             selection action bar on a phone. ---- */
      .switcher{ display:flex; align-items:center; gap:4px; background:#111; color:#fff;
        padding:6px 8px; font-size:12px; flex-shrink:0; }
      .switcher button{ background:rgba(255,255,255,0.14); color:#fff; border:0; border-radius:999px;
        width:30px; height:30px; font:inherit; }
      .switcher .name{ flex:1; text-align:center; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

      .blurb{ font-size:11px; color:#666; padding:6px 10px; background:#fafafa; border-bottom:1px solid #eee; flex-shrink:0; }
      .blurb b{ color:#111; }

      /* ---- toolbar ---- */
      .bar{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; padding:6px 10px; flex-shrink:0;
        border-bottom:1px solid #eee; }
      .bar .lbl{ font-size:10px; color:#71717a; text-transform:uppercase; letter-spacing:0.04em; }
      .seg{ display:flex; border:1px solid #d4d4d8; border-radius:8px; overflow:hidden; }
      .seg button{ font:inherit; font-size:11px; padding:5px 9px; border:0; border-left:1px solid #e4e4e7;
        background:#fff; color:#3f3f46; min-height:32px; }
      .seg button:first-child{ border-left:0; }
      .seg button.on{ background:#111; color:#fff; }
      .seg button.on.era{ background:#dc2626; }
      .bar input[type=range]{ width:86px; }

      /* ---- calendar ---- */
      .scroll{ flex:1; overflow:auto; position:relative; background:#fff;
        overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
      .inner{ display:flex; min-height:100%; }
      .gutter{ width:44px; flex-shrink:0; position:relative; background:#fff; z-index:2;
        border-right:1px solid #ececed; }
      .gutter .h{ position:absolute; right:5px; font-size:10px; color:#a1a1aa; font-variant-numeric:tabular-nums;
        transform:translateY(-50%); }
      .cols{ flex:1; position:relative; }
      .head{ position:sticky; top:0; z-index:4; display:flex; background:#fafafaee;
        backdrop-filter:blur(4px); border-bottom:1px solid #e4e4e7; }
      .head .hg{ width:44px; flex-shrink:0; }
      .head .hd{ flex:1; text-align:center; font-size:11px; font-weight:650; color:#52525b; padding:6px 0;
        border-left:1px solid #f1f1f3; }
      .head .hd.today{ color:#111; }
      #surface{ position:relative; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
      .vline{ position:absolute; top:0; bottom:0; width:1px; background:#f0f0f2; pointer-events:none; }
      .hm{ position:absolute; pointer-events:none; }          /* heatmap segment (others) */
      .mine{ position:absolute; pointer-events:none; border-radius:5px;
        border:2px solid var(--mine); box-shadow:0 0 0 2px oklch(0.58 0.17 258 / 0.22); }
      .mine .lab{ position:absolute; left:3px; top:1px; font-size:9px; font-weight:700;
        color:var(--mine); text-shadow:0 0 3px #fff, 0 0 3px #fff; }
      .draft{ position:absolute; pointer-events:none; border-radius:5px; background:oklch(0.58 0.17 258 / 0.30);
        border:2px dashed var(--mine); }
      .draft.era{ background:oklch(0.55 0.20 25 / 0.28); border-color:#dc2626; }
      .tag{ position:absolute; z-index:9; font-size:11px; font-weight:700; background:#111; color:#fff;
        padding:3px 7px; border-radius:5px; white-space:nowrap; pointer-events:none;
        font-variant-numeric:tabular-nums; }
      .tag.era{ background:#dc2626; }
      .press{ position:absolute; pointer-events:none; border-radius:999px; border:2px solid var(--mine);
        opacity:0.9; }

      /* fat touch handles — the answer to "edge resize is unhittable at 30-min rows" */
      .handle{ position:absolute; z-index:8; touch-action:none; display:flex; align-items:center;
        justify-content:center; }
      .handle .knob{ width:34px; height:14px; border-radius:999px; background:var(--mine);
        box-shadow:0 1px 4px rgba(0,0,0,0.35); border:2px solid #fff; }
      .selring{ position:absolute; pointer-events:none; border-radius:6px; outline:2px solid var(--mine);
        outline-offset:2px; }

      /* ---- bottom sheet / action bar ---- */
      .sheet{ position:fixed; left:0; right:0; bottom:0; z-index:20; background:#fff;
        border-top:1px solid #e4e4e7; box-shadow:0 -8px 28px rgba(0,0,0,0.14); padding:10px 12px 14px;
        border-radius:14px 14px 0 0; }
      .sheet h3{ margin:0 0 2px; font-size:13px; }
      .sheet .sub{ font-size:11px; color:#71717a; margin-bottom:8px; }
      .who{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:10px; min-height:26px; }
      .who .f{ display:flex; align-items:center; gap:5px; font-size:11px; background:#f4f4f5;
        border-radius:999px; padding:3px 9px 3px 3px; }
      .who .dot{ width:18px; height:18px; border-radius:999px; }
      .who .none{ font-size:11px; color:#a1a1aa; font-style:italic; }
      .acts{ display:flex; gap:6px; flex-wrap:wrap; }
      .acts button{ font:inherit; font-size:12px; min-height:40px; padding:0 14px; border-radius:9px;
        border:1px solid #d4d4d8; background:#fff; color:#18181b; flex:1; }
      .acts button.pri{ background:var(--mine); border-color:transparent; color:#fff; font-weight:650; }
      .acts button.dan{ color:#dc2626; border-color:#fecaca; }

      /* ---- state readout ---- */
      .readout{ flex-shrink:0; border-top:1px solid #e4e4e7; background:#fafafa; max-height:34vh; overflow:auto;
        padding:8px 10px 60px; font-size:11px; }
      .readout h4{ margin:0 0 4px; font-size:10px; text-transform:uppercase; letter-spacing:0.05em; color:#71717a; }
      .readout ol{ margin:0 0 10px; padding-left:18px; line-height:1.7; color:#3f3f46;
        font-variant-numeric:tabular-nums; }
      #log{ font:11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; white-space:pre-wrap; color:#3f3f46; }
      #log .sc{ color:#b45309; }
      #log .dr{ color:#1d4ed8; }
      #log .no{ color:#a1a1aa; }
      .toggle-readout{ position:fixed; right:8px; bottom:8px; z-index:30; font:inherit; font-size:11px;
        min-height:34px; padding:0 12px; border-radius:999px; border:1px solid #d4d4d8; background:#fff; }
      body.hide-readout .readout{ display:none; }
    </style>
  </head>
  <body>
    <div class="switcher">
      <button id="prev" aria-label="previous variant">←</button>
      <span class="name" id="vname"></span>
      <button id="next" aria-label="next variant">→</button>
    </div>
    <div class="blurb" id="blurb"></div>

    <div class="bar">
      <span class="lbl">view</span>
      <span class="seg" id="segView">
        <button data-v="1">Day</button><button data-v="3">3‑day</button><button data-v="7">Week</button>
      </span>
      <span class="lbl">row</span>
      <input type="range" id="rowPx" min="18" max="64" step="2" />
      <span id="rowLbl" style="font-size:11px;color:#71717a;width:58px"></span>
    </div>
    <div class="bar">
      <span class="lbl">drawing mode</span>
      <span class="seg" id="segMode">
        <button data-m="linear">Linear</button><button data-m="multi">Multi‑day</button>
      </span>
      <span class="lbl">hyst</span>
      <input type="range" id="hyst" min="0" max="90" step="5" style="width:64px" />
      <span id="hystLbl" style="font-size:11px;color:#71717a;width:34px"></span>
      <span class="seg" id="segHyst">
        <button data-h="anchor">anchor</button><button data-h="edge">edge</button>
      </span>
      <span class="seg" id="segTool"></span>
    </div>

    <div class="scroll" id="scroll">
      <div class="head" id="head"></div>
      <div class="inner">
        <div class="gutter" id="gutter"></div>
        <div class="cols"><div id="surface"></div></div>
      </div>
    </div>

    <div class="readout">
      <h4>My Availability (<span id="cnt">0</span> records)</h4>
      <ol id="records"></ol>
      <h4>Gesture log — <span class="sc">scroll</span> / <span class="dr">draw</span></h4>
      <div id="log"></div>
    </div>
    <button class="toggle-readout" id="tr">hide state</button>
    <div id="sheetHost"></div>

    <script>
    'use strict';
    // ------------------------------------------------------------------ model
    const SNAP = 30, SPD = 48, DAY = 1440, WEEK = 7 * DAY;
    const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    let seq = 0; const rid = () => 'av' + (++seq);
    const dayOf = m => Math.floor(m / DAY);
    const minOf = m => ((m % DAY) + DAY) % DAY;
    const hhmm = m => { const o = minOf(m); return String((o/60)|0).padStart(2,'0') + ':' + String(o%60).padStart(2,'0'); };
    const endLbl = m => minOf(m) === 0 ? '24:00' : hhmm(m);
    const fmt = r => { const a = dayOf(r.start), b = dayOf(r.end - 1);
      return a === b ? `${DAYS[a]} ${hhmm(r.start)}–${endLbl(r.end)}`
                     : `${DAYS[a]} ${hhmm(r.start)} → ${DAYS[b]} ${endLbl(r.end)}`; };
    const dur = m => { const h = (m/60)|0, x = m%60; return h ? (x ? `${h}h${x}` : `${h}h`) : `${x}m`; };

    const merge = rs => { const s = [...rs].sort((a,b)=>a.start-b.start||a.end-b.end), out=[];
      for (const r of s) { const l = out[out.length-1];
        if (l && r.start <= l.end) l.end = Math.max(l.end, r.end); else out.push({...r}); } return out; };
    const subtract = (rs,a,b) => { const out=[]; for (const r of rs) {
        if (b <= r.start || a >= r.end) { out.push(r); continue; }
        if (a > r.start) out.push({id:r.id, start:r.start, end:a});
        if (b < r.end)   out.push({id:rid(), start:b, end:r.end}); } return out; };
    const pieces = r => { const p=[]; let c=r.start; while (c<r.end){ const d=dayOf(c), to=Math.min(r.end,(d+1)*DAY);
        p.push({day:d, from:c-d*DAY, to:to-d*DAY, first:c===r.start, last:to===r.end}); c=to; } return p; };
    const at = (rs,abs) => rs.find(r => abs >= r.start && abs < r.end);
    const spanSlots = (a,b) => { const lo=Math.min(a,b), hi=Math.max(a,b); return {start:lo*SNAP, end:(hi+1)*SNAP}; };

    // Other Friends. Ticket 15: their colour never reaches the grid — only the
    // count does. Colour here is used solely in the "who is free" panel.
    const FRIENDS = [
      { name:'Ada',  hue: 30, ranges:[[0,9*60,13*60],[2,8*60,22*60],[4,18*60,23*60],[5,10*60,20*60]] },
      { name:'Bo',   hue:120, ranges:[[0,10*60,12*60],[2,12*60,19*60],[3,17*60,21*60],[5,9*60,14*60]] },
      { name:'Cy',   hue:200, ranges:[[1,20*60,23*60+30],[2,13*60,16*60],[4,19*60,22*60],[5,11*60,18*60]] },
      { name:'Dee',  hue:300, ranges:[[2,9*60,11*60],[2,14*60,18*60],[5,12*60,16*60],[6,10*60,15*60]] },
      { name:'Eli',  hue:350, ranges:[[2,15*60,20*60],[4,20*60,23*60],[5,13*60,19*60]] },
    ].map(f => ({...f, abs: merge(f.ranges.map(([d,a,b]) => ({id:rid(), start:d*DAY+a, end:d*DAY+b}))) }));
    const GROUP = FRIENDS.length + 1;

    const seedMine = () => merge([
      { id:rid(), start:0*DAY+9*60,  end:0*DAY+11*60 },
      { id:rid(), start:1*DAY+23*60, end:2*DAY+1*60  },   // cross-midnight: ONE record
      { id:rid(), start:2*DAY+8*60,  end:2*DAY+22*60 },   // the ticket-06 monolith
      { id:rid(), start:4*DAY+18*60, end:4*DAY+23*60 },
    ]);

    // count of visible Friends free in each 30-min slot of the week
    const COUNTS = new Int8Array(7 * SPD);
    for (const f of FRIENDS) for (const r of f.abs)
      for (let s = r.start/SNAP; s < r.end/SNAP; s++) COUNTS[s]++;
    const freeAt = abs => FRIENDS.filter(f => at(f.abs, abs));

    // ------------------------------------------------------------------ state
    const VARIANTS = [
      { key:'A', name:'Long‑press to draw',
        blurb:'<b>A · long-press then drag.</b> The grid scrolls normally. Hold still ~450&nbsp;ms and the surface arms (pulse + haptic where the platform has one); after that, dragging draws. Tap = open the slot panel. Release without moving after arming = one 30-min block.' },
      { key:'B', name:'Draw‑mode toggle',
        blurb:'<b>B · explicit mode.</b> Read / Draw / Erase, in the same chrome family as ticket 01’s “Drawing mode:” tabbar. In Read the grid scrolls; in Draw or Erase the grid does <i>not</i> scroll by one finger at all — drag draws, edge auto-scroll extends past the viewport, two fingers pan.' },
      { key:'C', name:'Tap slot → panel → handles',
        blurb:'<b>C · no drag-to-create at all.</b> Tap a slot, get a panel that answers <i>who is free here</i> and offers “I’m free”. The block lands 30 min and selected, with fat handles to stretch. The grid keeps <code>pan-y</code> forever, so scroll is never in contention.' },
    ];

    const S = {
      vi: 0, view: 3, day0: 0, rowPx: 44, mode: 'linear', hyst: 40, hystModel: 'anchor',
      tool: 'read',                 // variant B only: read | draw | erase
      erase: false,                 // variants A/C: the ticket-01 erase toggle
      mine: seedMine(), sel: null, sheet: null,
      dup: null,                    // {mins} — "tap a slot to drop the copy"
    };
    const V = () => VARIANTS[S.vi];

    // ------------------------------------------------------------------- log
    const logEl = document.getElementById('log');
    let lastLog = 0;
    function log(kind, msg) {
      const t = performance.now();
      const d = lastLog ? '+' + Math.round(t - lastLog) + 'ms ' : '';
      lastLog = t;
      const cls = kind === 'scroll' ? 'sc' : kind === 'draw' ? 'dr' : 'no';
      logEl.insertAdjacentHTML('afterbegin', `<span class="${cls}">${d}${msg}</span>\n`);
      while (logEl.childNodes.length > 90) logEl.removeChild(logEl.lastChild);
    }
    const HAPTICS = typeof navigator.vibrate === 'function';
    const buzz = ms => { if (HAPTICS) navigator.vibrate(ms); };

    // ------------------------------------------------------------------ chrome
    const scroller = document.getElementById('scroll');
    const surface  = document.getElementById('surface');
    const gutter   = document.getElementById('gutter');
    const headEl   = document.getElementById('head');
    const sheetHost= document.getElementById('sheetHost');

    function paintChrome() {
      document.getElementById('vname').textContent = V().key + ' — ' + V().name;
      document.getElementById('blurb').innerHTML = V().blurb;
      for (const b of document.querySelectorAll('#segView button')) b.classList.toggle('on', +b.dataset.v === S.view);
      for (const b of document.querySelectorAll('#segMode button')) b.classList.toggle('on', b.dataset.m === S.mode);
      document.getElementById('rowPx').value = S.rowPx;
      document.getElementById('rowLbl').textContent = S.rowPx + 'px/30m';
      document.getElementById('hyst').value = S.hyst;
      document.getElementById('hystLbl').textContent = S.hyst + '%';
      for (const b of document.querySelectorAll('#segHyst button')) b.classList.toggle('on', b.dataset.h === S.hystModel);
      document.getElementById('hyst').style.opacity = S.mode === 'linear' ? 1 : 0.35;
      document.getElementById('segHyst').style.opacity = S.mode === 'linear' ? 1 : 0.35;

      const st = document.getElementById('segTool');
      if (V().key === 'B') {
        st.innerHTML = ['read','draw','erase'].map(t =>
          `<button data-t="${t}" class="${S.tool===t?'on'+(t==='erase'?' era':''):''}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('');
      } else {
        st.innerHTML = `<button data-t="erasetgl" class="${S.erase?'on era':''}">Erase drag</button>`;
      }
      // touch-action is the entire ballgame — set it from the variant + tool
      surface.style.touchAction = touchActionFor();
      log('none', `touch-action = ${surface.style.touchAction}`);
    }
    function touchActionFor() {
      if (V().key === 'C') return 'pan-x pan-y';               // never contended
      if (V().key === 'A') return 'pan-x pan-y';               // armed drags preventDefault instead
      return S.tool === 'read' ? 'pan-x pan-y' : 'none';       // B: mode decides
    }

    // ------------------------------------------------------------------ render
    let colW = 100;
    function layout() {
      const cols = S.view;
      surface.style.height = (SPD * S.rowPx) + 'px';
      colW = surface.getBoundingClientRect().width / cols;
    }
    function renderStatic() {
      const cols = S.view, H = SPD * S.rowPx;
      // header
      headEl.innerHTML = '<div class="hg"></div>' + Array.from({length:cols}, (_,i) =>
        `<div class="hd">${DAYS[(S.day0+i)%7]}</div>`).join('');
      // gutter
      gutter.style.height = (H + 0) + 'px';
      gutter.innerHTML = Array.from({length:24}, (_,h) =>
        h === 0 ? '' : `<div class="h" style="top:${h*2*S.rowPx}px">${String(h).padStart(2,'0')}:00</div>`).join('');
      // grid lines via gradient (cheap; 336 cells as DOM is not)
      surface.style.background =
        `repeating-linear-gradient(to bottom, #f4f4f5 0 1px, transparent 1px ${S.rowPx}px),` +
        `repeating-linear-gradient(to bottom, #e4e4e7 0 1px, transparent 1px ${2*S.rowPx}px)`;
      surface.style.height = H + 'px';

      let html = '';
      for (let c = 1; c < cols; c++) html += `<div class="vline" style="left:${(c*100/cols).toFixed(4)}%"></div>`;

      // heatmap: runs of constant count, per visible day (ticket 15)
      for (let c = 0; c < cols; c++) {
        const d = S.day0 + c; if (d > 6) break;
        let s = 0;
        while (s < SPD) {
          const n = COUNTS[d*SPD + s];
          let e = s; while (e < SPD && COUNTS[d*SPD+e] === n) e++;
          if (n > 0) {
            const a = (0.10 + 0.72 * (n / FRIENDS.length)).toFixed(3);
            html += `<div class="hm" style="left:${(c*100/cols).toFixed(4)}%;width:${(100/cols).toFixed(4)}%;` +
                    `top:${s*S.rowPx}px;height:${(e-s)*S.rowPx}px;background:oklch(0.58 0.17 258 / ${a})"></div>`;
          }
          s = e;
        }
      }
      // my Availability: border + ring, never a solid fill (ticket 15)
      for (const r of S.mine) for (const p of pieces(r)) {
        const c = p.day - S.day0; if (c < 0 || c >= cols) continue;
        const top = p.from / SNAP * S.rowPx, h = (p.to - p.from) / SNAP * S.rowPx;
        html += `<div class="mine" style="left:calc(${(c*100/cols).toFixed(4)}% + 2px);` +
                `width:calc(${(100/cols).toFixed(4)}% - 4px);top:${top+1}px;height:${h-2}px">` +
                (p.first ? `<span class="lab">${hhmm(r.start)}</span>` : `<span class="lab">↑</span>`) + `</div>`;
      }
      surface.innerHTML = html + '<div id="dyn"></div>';
      renderDyn();
      renderRecords();
    }

    // dynamic layer: draft, selection ring, handles, press indicator
    let draft = null, press = null;
    function renderDyn() {
      const dyn = document.getElementById('dyn'); if (!dyn) return;
      const cols = S.view; let html = '';
      if (draft) {
        for (const r of draft.ranges) for (const p of pieces(r)) {
          const c = p.day - S.day0; if (c < 0 || c >= cols) continue;
          html += `<div class="draft ${draft.erase?'era':''}" style="left:calc(${(c*100/cols).toFixed(4)}% + 2px);` +
                  `width:calc(${(100/cols).toFixed(4)}% - 4px);top:${p.from/SNAP*S.rowPx+1}px;` +
                  `height:${(p.to-p.from)/SNAP*S.rowPx-2}px"></div>`;
        }
        const r0 = draft.ranges[0], rN = draft.ranges[draft.ranges.length-1];
        if (r0) {
          const c = Math.max(0, Math.min(cols-1, dayOf(r0.start) - S.day0));
          const total = draft.ranges.reduce((a,r)=>a+(r.end-r.start),0);
          html += `<div class="tag ${draft.erase?'era':''}" style="left:${(c*100/cols).toFixed(4)}%;` +
                  `top:${Math.max(0, r0.start%DAY/SNAP*S.rowPx - 26)}px">` +
                  `${draft.erase?'erase ':''}${hhmm(r0.start)}–${endLbl(rN.end)} · ${dur(total)}</div>`;
        }
      }
      if (press) html += `<div class="press" style="left:${press.x-press.r}px;top:${press.y-press.r}px;` +
                         `width:${press.r*2}px;height:${press.r*2}px"></div>`;
      const sel = S.sel && S.mine.find(r => r.id === S.sel);
      if (sel && !draft) {
        for (const p of pieces(sel)) {
          const c = p.day - S.day0; if (c < 0 || c >= cols) continue;
          html += `<div class="selring" style="left:calc(${(c*100/cols).toFixed(4)}% + 2px);` +
                  `width:calc(${(100/cols).toFixed(4)}% - 4px);top:${p.from/SNAP*S.rowPx+1}px;` +
                  `height:${(p.to-p.from)/SNAP*S.rowPx-2}px"></div>`;
        }
        // handles: 44px tall hit areas centred on each end, in the end's own column
        const mk = (edge, abs) => {
          const c = dayOf(edge === 'end' ? abs - 1 : abs) - S.day0;
          if (c < 0 || c >= cols) return '';
          const y = (edge === 'end' ? (abs - dayOf(abs-1)*DAY) : (abs % DAY)) / SNAP * S.rowPx;
          return `<div class="handle" data-edge="${edge}" style="left:${(c*100/cols).toFixed(4)}%;` +
                 `width:${(100/cols).toFixed(4)}%;top:${y-22}px;height:44px"><div class="knob"></div></div>`;
        };
        html += mk('start', sel.start) + mk('end', sel.end);
      }
      dyn.innerHTML = html;
    }
    function renderRecords() {
      document.getElementById('cnt').textContent = S.mine.length;
      document.getElementById('records').innerHTML =
        S.mine.map(r => `<li${r.id===S.sel?' style="font-weight:700;color:#111"':''}>${fmt(r)} · ${dur(r.end-r.start)}</li>`).join('')
        || '<li style="color:#a1a1aa">none</li>';
    }
    const render = () => { layout(); renderStatic(); renderSheet(); };

    // ------------------------------------------------------------------ hit test
    function hit(clientX, clientY) {
      const b = surface.getBoundingClientRect();
      const x = clientX - b.left, y = clientY - b.top;
      const cols = S.view;
      const raw = x / (b.width / cols);
      let col = Math.floor(raw); col = Math.max(0, Math.min(cols - 1, col));
      const row = Math.max(0, Math.min(SPD - 1, Math.floor(y / S.rowPx)));
      return { x, y, col, colFrac: raw - Math.floor(raw), rawCol: raw,
               day: S.day0 + col, row, abs: (S.day0 + col) * DAY + row * SNAP,
               slot: (S.day0 + col) * SPD + row };
    }

    // ------------------------------------------------------------------ gesture
    let g = null;             // active gesture
    let armTimer = null;
    const MOVE_TOL = 10;      // px of slop before a press stops being a press
    const ARM_MS  = 450;

    function beginDraw(h, kind) {
      g.drawing = true; g.kind = kind; g.anchor = h;
      g.anchorCol = h.rawCol; g.escaped = false;
      try { surface.setPointerCapture(g.id); } catch { /* scripted gestures have no real pointer */ }
      updateDraft(h);
      log('draw', `DRAW armed (${kind}) at ${DAYS[h.day]} ${hhmm(h.abs)}`);
    }

    /**
     * Column hysteresis — ticket 01 asked for "the pointer must travel
     * meaningfully into the next day before the range follows". Two models,
     * because they are NOT equivalent on a phone:
     *
     *  edge   — measured from the column boundary (the obvious reading of 01).
     *           Fails when the finger starts near a boundary: the budget is
     *           already spent before the drag begins.
     *  anchor — measured from where the finger went down, in absolute px.
     *           The budget is the same wherever you start.
     */
    function effectiveCol(h) {
      const raw = Math.max(0, Math.min(S.view - 1, Math.floor(h.rawCol)));
      if (S.mode !== 'linear' || S.hyst === 0) return raw;
      const cur = g.curCol ?? Math.floor(g.anchorCol);
      if (g.escaped) return raw;
      if (S.hystModel === 'anchor') {
        const dx = Math.abs(h.x - g.anchor.x);
        if (dx >= (S.hyst / 100) * colW) { g.escaped = true; g.curCol = raw; }
        else g.curCol = cur;
      } else {
        if (raw === cur) g.curCol = cur;
        else {
          const frac = h.rawCol - Math.floor(h.rawCol);
          const into = raw > cur ? frac : 1 - frac;
          g.curCol = into >= S.hyst / 100 ? raw : cur;
        }
      }
      return g.curCol;
    }

    function updateDraft(h) {
      const aCol = Math.floor(g.anchorCol), aRow = g.anchor.row;
      const bCol = effectiveCol(h), bRow = h.row;
      let ranges;
      if (S.mode === 'multi') {
        const lo = Math.min(aCol, bCol), hi = Math.max(aCol, bCol);
        const r0 = Math.min(aRow, bRow), r1 = Math.max(aRow, bRow);
        ranges = [];
        for (let c = lo; c <= hi; c++) {
          const d = S.day0 + c; if (d > 6) continue;
          ranges.push({ id:'draft'+c, start: d*DAY + r0*SNAP, end: d*DAY + (r1+1)*SNAP });
        }
      } else {
        const a = (S.day0 + aCol) * SPD + aRow, b = (S.day0 + bCol) * SPD + bRow;
        const s = spanSlots(a, b);
        ranges = [{ id:'draft', start: s.start, end: s.end }];
      }
      draft = { ranges, erase: g.kind === 'erase' };
      renderDyn();
    }

    function commitDraft() {
      if (!draft) return;
      if (draft.erase) {
        for (const r of draft.ranges) S.mine = subtract(S.mine, r.start, r.end);
        log('draw', `ERASE commit → ${S.mine.length} records`);
      } else {
        S.mine = merge([...S.mine, ...draft.ranges.map(r => ({ id:rid(), start:r.start, end:r.end }))]);
        const made = draft.ranges[0];
        S.sel = (S.mine.find(r => made.start >= r.start && made.start < r.end) || {}).id ?? null;
        log('draw', `CREATE commit → ${S.mine.length} records`);
      }
      draft = null;
      render();
    }

    // -- resize by handle -------------------------------------------------
    let hg = null;   // {edge, id, fixed}
    function onHandleDown(e, edge) {
      const sel = S.mine.find(r => r.id === S.sel); if (!sel) return;
      e.preventDefault(); e.stopPropagation();
      hg = { edge, id: sel.id, fixed: edge === 'start' ? sel.end : sel.start, pid: e.pointerId };
      try { e.target.setPointerCapture(e.pointerId); } catch { /* scripted */ }
      log('draw', `HANDLE ${edge} grabbed (touch-action:none on the knob — never scrolls)`);
    }
    function onHandleMove(e) {
      if (!hg) return;
      e.preventDefault();
      const h = hit(e.clientX, e.clientY);
      autoScroll(e.clientY);
      const rec = S.mine.find(r => r.id === hg.id); if (!rec) return;
      let s = rec.start, en = rec.end;
      const edgeAbs = hg.edge === 'start' ? h.abs : h.abs + SNAP;
      if (hg.edge === 'start') s = Math.min(edgeAbs, hg.fixed - SNAP);
      else en = Math.max(edgeAbs, hg.fixed + SNAP);
      rec.start = Math.max(0, s); rec.end = Math.min(WEEK, en);
      renderStatic();
    }
    function onHandleUp() {
      if (!hg) return;
      S.mine = merge(S.mine);
      const keep = S.mine.find(r => r.id === hg.id) || S.mine.find(r => r.start <= hg.fixed && hg.fixed < r.end);
      S.sel = keep ? keep.id : null;
      log('draw', `HANDLE released → ${S.mine.length} records`);
      hg = null; render();
    }

    let rafScroll = 0;
    function autoScroll(clientY) {
      const b = scroller.getBoundingClientRect();
      const EDGE = 70;
      let dy = 0;
      if (clientY < b.top + EDGE) dy = -Math.ceil((b.top + EDGE - clientY) / 5);
      else if (clientY > b.bottom - EDGE) dy = Math.ceil((clientY - (b.bottom - EDGE)) / 5);
      if (dy) scroller.scrollTop += dy;
    }

    // -- the surface ------------------------------------------------------
    surface.addEventListener('pointerdown', e => {
      const handle = e.target.closest?.('.handle');
      if (handle) { onHandleDown(e, handle.dataset.edge); return; }
      if (g) return;
      const h = hit(e.clientX, e.clientY);
      g = { id: e.pointerId, t0: performance.now(), x0: e.clientX, y0: e.clientY,
            scrollTop0: scroller.scrollTop, h0: h, moved: 0, drawing: false, armed: false,
            type: e.pointerType, kind: null, anchor: null, anchorCol: h.rawCol, curCol: null };

      const key = V().key;
      if (key === 'B' && S.tool !== 'read') {
        // touch-action:none on the surface — the browser will not scroll at all
        beginDraw(h, S.tool === 'erase' ? 'erase' : 'create');
      } else if (key === 'A') {
        press = { x: h.x, y: h.y, r: 6 };
        renderDyn();
        armTimer = setTimeout(() => {
          if (!g || g.moved > MOVE_TOL) return;
          g.armed = true;
          press = { x: h.x, y: h.y, r: 22 }; renderDyn();
          buzz(12);
          const inBlock = at(S.mine, h.abs);
          beginDraw(h, (S.erase || (inBlock && !S.erase && false)) ? 'erase' : 'create');
          log('draw', `long-press armed after ${ARM_MS}ms · haptics ${HAPTICS ? 'fired' : 'UNSUPPORTED on this platform'}`);
        }, ARM_MS);
      }
      // key === 'C': nothing on pointerdown at all. Scroll owns the surface.
    });

    surface.addEventListener('pointermove', e => {
      if (hg) { onHandleMove(e); return; }
      if (!g || e.pointerId !== g.id) return;
      g.moved = Math.max(g.moved, Math.hypot(e.clientX - g.x0, e.clientY - g.y0));
      if (g.drawing) {
        e.preventDefault();
        autoScroll(e.clientY);
        updateDraft(hit(e.clientX, e.clientY));
      } else if (g.moved > MOVE_TOL && armTimer) {
        clearTimeout(armTimer); armTimer = null;
        press = null; renderDyn();
        log('scroll', `moved ${Math.round(g.moved)}px before ${ARM_MS}ms → browser keeps the gesture (SCROLL)`);
      }
    });

    // The real test: a non-passive touchmove listener. Once armed we must be
    // able to cancel the browser's scroll. If the browser has already started
    // scrolling this preventDefault is ignored — that is what we are measuring.
    surface.addEventListener('touchmove', e => {
      if (g && g.drawing) { if (e.cancelable) e.preventDefault(); else log('scroll', '⚠ touchmove NOT cancelable — browser already owns this gesture'); }
      if (hg && e.cancelable) e.preventDefault();
    }, { passive: false });

    function endGesture(e) {
      if (hg) { onHandleUp(); return; }
      if (!g || (e && e.pointerId !== g.id)) return;
      clearTimeout(armTimer); armTimer = null;
      press = null;
      const dt = Math.round(performance.now() - g.t0);
      const scrolled = Math.abs(scroller.scrollTop - g.scrollTop0);
      if (g.drawing) {
        commitDraft();
      } else if (g.moved <= MOVE_TOL && scrolled < 3) {
        onTap(g.h0, dt);
      } else {
        log('scroll', `SCROLLED ${scrolled}px in ${dt}ms — nothing drawn`);
        renderDyn();
      }
      g = null;
    }
    surface.addEventListener('pointerup', endGesture);
    surface.addEventListener('pointercancel', e => {
      if (g && !g.drawing) log('scroll', 'pointercancel — the scroller took the gesture');
      clearTimeout(armTimer); armTimer = null; press = null; draft = null;
      if (hg) onHandleUp();
      g = null; renderDyn();
    });
    surface.addEventListener('contextmenu', e => e.preventDefault());

    function onTap(h, dt) {
      if (S.dup) { dropDuplicate(h); return; }
      const block = at(S.mine, h.abs);
      if (block) { S.sel = block.id; S.sheet = { kind:'block', id: block.id };
        log('none', `tap ${dt}ms → selected ${fmt(block)}`); render(); return; }
      if (V().key === 'A') { S.sel = null; S.sheet = { kind:'slot', abs: h.abs };
        log('none', `tap ${dt}ms → slot panel (who is free)`); render(); return; }
      if (V().key === 'B') {
        if (S.tool === 'read') { S.sel = null; S.sheet = { kind:'slot', abs: h.abs };
          log('none', `tap ${dt}ms → slot panel`); render(); }
        return;
      }
      // C
      S.sel = null; S.sheet = { kind:'slot', abs: h.abs };
      log('none', `tap ${dt}ms → slot panel (who is free + “I’m free”)`);
      render();
    }

    // ------------------------------------------------------------------ sheet
    function renderSheet() {
      const s = S.sheet;
      if (!s) { sheetHost.innerHTML = ''; document.body.style.paddingBottom = ''; return; }
      let head, sub, whoAbs, acts;
      if (s.kind === 'slot') {
        head = `${DAYS[dayOf(s.abs)]} ${hhmm(s.abs)}–${endLbl(s.abs + SNAP)}`;
        sub = 'You are not free here.';
        whoAbs = s.abs;
        acts = `<button class="pri" data-a="create">＋ I’m free</button>` +
               `<button data-a="close">Close</button>`;
      } else {
        const r = S.mine.find(x => x.id === s.id);
        if (!r) { S.sheet = null; return renderSheet(); }
        head = fmt(r); sub = `${dur(r.end - r.start)} · drag a handle to stretch`;
        whoAbs = r.start;
        acts = `<button data-a="dup">Duplicate</button>` +
               `<button class="dan" data-a="del">Delete</button>` +
               `<button class="pri" data-a="close">Done</button>`;
      }
      const who = freeAt(whoAbs);
      const glow = 2 * (who.length + (at(S.mine, whoAbs) ? 1 : 0)) > GROUP;
      sheetHost.innerHTML =
        `<div class="sheet"><h3>${head}${glow ? ' <span style="font-size:10px;color:#a16207">◆ candidate</span>' : ''}</h3>` +
        `<div class="sub">${sub}</div>` +
        `<div class="who">` + (who.length
          ? who.map(f => `<span class="f"><span class="dot" style="background:oklch(0.62 0.16 ${f.hue})"></span>${f.name}</span>`).join('')
          : '<span class="none">nobody else is free here</span>') + `</div>` +
        `<div class="acts">${acts}</div>` +
        (S.dup ? `<div class="sub" style="margin:8px 0 0">Tap a slot to drop the copy.</div>` : '') +
        `</div>`;
      document.body.style.paddingBottom = '0';
    }
    sheetHost.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      const a = b.dataset.a, s = S.sheet;
      if (a === 'close') { S.sheet = null; S.sel = null; S.dup = null; render(); }
      else if (a === 'create') {
        S.mine = merge([...S.mine, { id: rid(), start: s.abs, end: s.abs + SNAP }]);
        const made = at(S.mine, s.abs);
        S.sel = made.id; S.sheet = { kind:'block', id: made.id };
        log('draw', `PANEL create → 30 min at ${hhmm(s.abs)} · ${S.mine.length} records`);
        render();
      }
      else if (a === 'del') {
        const r = S.mine.find(x => x.id === s.id);
        S.mine = S.mine.filter(x => x.id !== s.id);
        log('draw', `DELETE ${fmt(r)} → ${S.mine.length} records`);
        S.sel = null; S.sheet = null; render();
      }
      else if (a === 'dup') {
        const r = S.mine.find(x => x.id === s.id);
        S.dup = { mins: r.end - r.start };
        log('none', 'duplicate armed — tap a slot to drop (no ⌥ on touch)');
        render();
      }
    });
    function dropDuplicate(h) {
      const { mins } = S.dup; S.dup = null;
      S.mine = merge([...S.mine, { id: rid(), start: h.abs, end: Math.min(WEEK, h.abs + mins) }]);
      const made = at(S.mine, h.abs);
      S.sel = made.id; S.sheet = { kind:'block', id: made.id };
      log('draw', `DUPLICATE dropped at ${DAYS[h.day]} ${hhmm(h.abs)} → ${S.mine.length} records`);
      render();
    }

    // ------------------------------------------------------------------ wiring
    document.getElementById('prev').onclick = () => { S.vi = (S.vi + VARIANTS.length - 1) % VARIANTS.length; reset(); };
    document.getElementById('next').onclick = () => { S.vi = (S.vi + 1) % VARIANTS.length; reset(); };
    document.getElementById('segView').onclick = e => { const b = e.target.closest('button'); if (!b) return;
      S.view = +b.dataset.v; paintChrome(); render(); };
    document.getElementById('segMode').onclick = e => { const b = e.target.closest('button'); if (!b) return;
      S.mode = b.dataset.m; paintChrome(); };
    document.getElementById('segHyst').onclick = e => { const b = e.target.closest('button'); if (!b) return;
      S.hystModel = b.dataset.h; paintChrome(); };
    document.getElementById('segTool').onclick = e => { const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.t === 'erasetgl') S.erase = !S.erase; else S.tool = b.dataset.t;
      S.sheet = null; S.sel = null; paintChrome(); render(); };
    document.getElementById('rowPx').oninput = e => { S.rowPx = +e.target.value; paintChrome(); render(); };
    document.getElementById('hyst').oninput  = e => { S.hyst  = +e.target.value; paintChrome(); };
    document.getElementById('tr').onclick = () => { document.body.classList.toggle('hide-readout');
      document.getElementById('tr').textContent = document.body.classList.contains('hide-readout') ? 'show state' : 'hide state'; };
    window.addEventListener('keydown', e => { const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      if (e.key === 'ArrowLeft') document.getElementById('prev').click();
      if (e.key === 'ArrowRight') document.getElementById('next').click(); });
    window.addEventListener('resize', () => render());

    function reset() {
      S.mine = seedMine(); S.sel = null; S.sheet = null; S.dup = null; S.tool = 'read'; S.erase = false;
      draft = null; press = null; g = null;
      logEl.innerHTML = ''; lastLog = 0;
      paintChrome(); render();
      log('none', `variant ${V().key} · haptics ${HAPTICS ? 'available' : 'UNAVAILABLE (no navigator.vibrate — iOS Safari)'}`);
    }

    const p = new URLSearchParams(location.search);
    const want = (p.get('variant') || 'A').toUpperCase();
    S.vi = Math.max(0, VARIANTS.findIndex(v => v.key === want));
    reset();
    scroller.scrollTop = 8 * 2 * S.rowPx;

    // ------------------------------------------------------- scripted gestures
    // Replays a finger as pointer + touch events. This exercises the app's
    // state machine exactly; it does NOT exercise the compositor, so it can
    // never tell you whether the browser would have scrolled. That answer is
    // printed to the log by a real finger — see the ⚠ lines.
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    /**
     * Scroll `minutes` of `day` to the middle of the viewport and return the
     * VIEWPORT coordinate of that cell. A finger stays put on the glass while
     * the content moves under it, so every scripted point must be viewport-
     * relative — surface-relative points silently drift the moment auto-scroll
     * or a scroll fires.
     */
    function focus(day, minutes, colFrac = 0.5) {
      S.day0 = Math.max(0, Math.min(6 - (S.view - 1), day - Math.floor((S.view - 1) / 2)));
      render();
      const sb = scroller.getBoundingClientRect();
      const rowY = minutes / SNAP * S.rowPx;
      scroller.scrollTop = Math.max(0, rowY - sb.height / 2);
      const b = surface.getBoundingClientRect();
      const col = day - S.day0;
      return { cx: b.left + (col + colFrac) * (b.width / S.view), cy: b.top + rowY };
    }
    async function gesture({ cx, cy, dx = 0, dy = 0, hold = 0, steps = 10, stepMs = 16, jitterX = 0, up = true }) {
      const mk = (type, X, Y, cancelable = true) => {
        const ev = new PointerEvent(type, { pointerId: 7, pointerType: 'touch', isPrimary: true,
          bubbles: true, cancelable, clientX: X, clientY: Y, buttons: type === 'pointerup' ? 0 : 1 });
        surface.dispatchEvent(ev);
        if (type === 'pointermove') {
          try {
            const t = new Touch({ identifier: 7, target: surface, clientX: X, clientY: Y });
            surface.dispatchEvent(new TouchEvent('touchmove', { bubbles: true, cancelable: true,
              touches: [t], targetTouches: [t], changedTouches: [t] }));
          } catch { /* Touch ctor unavailable */ }
        }
      };
      mk('pointerdown', cx, cy);
      if (hold) await sleep(hold);
      for (let i = 1; i <= steps; i++) {
        const t = i / steps;
        const jx = jitterX * Math.sin(t * Math.PI);      // a thumb arcs sideways and comes back
        mk('pointermove', cx + dx * t + jx, cy + dy * t);
        await sleep(stepMs);
      }
      if (up) mk('pointerup', cx + dx, cy + dy);
      await sleep(20);
      return { records: S.mine.map(fmt), n: S.mine.length, log: logEl.textContent.split('\n').slice(0, 4) };
    }
    async function tap(cx, cy, ms = 90) { return gesture({ cx, cy, hold: ms, steps: 0 }); }

    // expose for instrumentation
    window.__proto10 = { S, VARIANTS, hit, log, gesture, tap, focus, reset, colW: () => colW,
      geom: () => ({ colW, rowPx: S.rowPx, gridW: surface.getBoundingClientRect().width }),
      get mine(){ return S.mine.map(fmt); },
      set: patch => { Object.assign(S, patch); paintChrome(); render(); },
      setVariant: k => { S.vi = Math.max(0, VARIANTS.findIndex(v => v.key === k)); reset(); } };
    </script>
  </body>
</html>
