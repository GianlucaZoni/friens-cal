  Zero-dependency twin of index.tsx. Double-click it; it runs over file://.
  Same synthetic month, same slot table, same metrics, same colour maths
  (ticket 11's `oklch(L_theme, C_theme, hue)` and ticket 15's opacity ramp),

  ONE DIFFERENCE, AND IT MATTERS: `@blobatar/react` cannot be loaded from a
  file:// page, so a dot here is a CSS circle with two eyes at the identical

  be judged in the React version, which renders real blobatars:

      <dev server> /src/prototypes/month-cell/dev.html?variant=C
-->
<html lang="en">

      .hb-l { top: 0; bottom: 0; left: 0; width: 2px; } .hb-r { top: 0; bottom: 0; right: 0; width: 2px; }

      .card > .cap { font-size: 10px; color: var(--mutedfg); margin-bottom: 4px; min-height: 26px; max-width: 100px; line-height: 1.3; }
      .std { position: relative; width: 78px; height: 72px; border: 1px solid var(--border); border-radius: 5px; background: var(--card); }

  <body class="light">
    <h1>Month cell — what a day shows</h1
    ><span class="flag">PROTOTYPE · ticket 14 · throwaway · fake data · dots are STAND-INS</span>
    <div class="bar" id="bar"></div>
    <div id="out"></div>
    <div class="switcher">
      <button id="prev">‹</button><span class="name" id="vname"></span><button id="next">›</button>
    </div>

    <script>
/* ------------------------------------------------------------------ colour */
/* Ticket 11: every non-avatar use of a Friend's colour is oklch(L,C,hue).
   Two constants per theme; hue is the only free axis. */
const UI_L = { light: 0.58, dark: 0.74 }, UI_C = { light: 0.152, dark: 0.132 };
const ui = (hue, dark, a = 1) =>
  `oklch(${dark ? UI_L.dark : UI_L.light} ${dark ? UI_C.dark : UI_C.light} ${hue} / ${a})`;
/* blobatar 2.7.0 TONES, verbatim — the AVATAR colour, lightness unclamped.
   The numbers are band UPPER EDGES, not values: blobatar resolves a tone with
   `find(([edge]) => v < edge) ?? TONES[0]`, so 0.62 is *deep* and 1.0 wraps to
   *pastel*. Friends below therefore store band INTERIORS. */
const TONES = [[.2,{l:.86,c:.085},'pastel'],[.36,{l:.9,c:.028},'pale neutral'],[.62,{l:.73,c:.135},'mid'],
               [.8,{l:.62,c:.165},'deep'],[.93,{l:.87,c:.16},'bright'],[1,{l:.34,c:.035},'ink']];
const T = { pastel:.1, paleNeutral:.28, mid:.49, deep:.71, bright:.86, ink:.96 };
const toneAt = v => TONES.find(([edge]) => v < edge) || TONES[0];
const toneName = v => toneAt(v)[2];
const avatar = (hue, tone) => { const {l,c} = toneAt(tone)[1]; return `oklch(${l} ${c} ${hue})`; };
/* Ticket 15's heatmap ramp, tuned twice as that ticket said it must be. */
const WASH = { light: { min: .07, max: .62 }, dark: { min: .1, max: .5 } };
const wash = (t, dark) => {
  const r = dark ? WASH.dark : WASH.light, x = Math.max(0, Math.min(1, t));
  return x <= 0 ? 'transparent' : ui(VIEWER.hue, dark, r.min + (r.max - r.min) * x);
};

/* -------------------------------------------------------------------- data */
const VIEWER = { id:0, name:'You', hue:305, tone:T.mid, note:'viewer' };
const OTHERS = [
  { id:1, name:'Marco',  hue:28,  tone:T.deep,        note:'deep' },
  { id:2, name:'Sara',   hue:152, tone:T.mid,         note:'mid' },
  { id:3, name:'Giulia', hue:262, tone:T.mid,         note:'mid — collides with Luca' },
  { id:4, name:'Luca',   hue:268, tone:T.mid,         note:'mid — collides with Giulia' },
  { id:5, name:'Elena',  hue:92,  tone:T.paleNeutral, note:'pale neutral — l .90' },
  { id:6, name:'Dario',  hue:200, tone:T.deep,        note:'deep' },
  { id:7, name:'Nadia',  hue:340, tone:T.bright,      note:'bright' },
  { id:8, name:'Teo',    hue:62,  tone:T.ink,         note:'ink — l .34' },
];
const ALL = [VIEWER, ...OTHERS];
const byId = id => ALL.find(f => f.id === id) || VIEWER;
const SPD = 48, WEEKDAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], TODAY = 16;
const DAYS = Array.from({ length: 35 }, (_, i) => {
  const d = new Date(Date.UTC(2026, 7, 31) + i * 86400000);
  return { index: i, date: d.getUTCDate(), inMonth: d.getUTCMonth() === 8, weekend: i % 7 >= 5 };
});
const fmtSlot = s => `${String(Math.floor(s/2)).padStart(2,'0')}:${s%2?'30':'00'}`;

function mulberry32(seed) { let a = seed >>> 0; return () => {
  a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a>>>15), 1 | a);
  t = (t + Math.imul(t ^ (t>>>7), 61 | t)) ^ t; return ((t ^ (t>>>14)) >>> 0) / 4294967296; }; }

/* Availability is SLOT ROWS (ticket 07). A day is 48 half-hour slots. */
const SLOTS = (() => {
  const rnd = mulberry32(20260914), table = {};
  for (const day of DAYS) {
    const per = {};
    for (const f of ALL) {
      const owned = new Set();
      const n = rnd() < (day.weekend ? .85 : .52) ? (rnd() < .3 ? 2 : 1) : 0;
      for (let w = 0; w < n; w++) {
        const anchor = day.weekend ? 20 + Math.floor(rnd()*22) : 34 + Math.floor(rnd()*8);
        const len = 3 + Math.floor(rnd() * (day.weekend ? 12 : 7));
        for (let s = anchor; s < Math.min(SPD, anchor+len); s++) owned.add(s);
      }
      per[f.id] = owned;
    }
    table[day.index] = per;
  }
  const fill = (d, id, a, b) => { for (let s = a; s < b; s++) table[d][id].add(s); };
  const clear = (d, id) => table[d][id].clear();
  /* 12 — full house. */            ALL.forEach(f => { clear(12, f.id); fill(12, f.id, 40, 46); });
  /* 5 — everyone free, NOBODY together: eight disjoint windows, peak 1. */
  ALL.forEach(f => clear(5, f.id)); ALL.forEach((f, i) => fill(5, f.id, 2 + i*5, 6 + i*5));
  /* 6 — the mirror: same people, same day, all at once. Identical dot row. */
  ALL.forEach(f => { clear(6, f.id); fill(6, f.id, 38, 42); });
  /* 17 — the near-collision pair alone. */
  ALL.forEach(f => clear(17, f.id)); fill(17, 3, 38, 44); fill(17, 4, 39, 45);
  /* 22 — two Friends, most of the day. Long coverage, low peak. */
  ALL.forEach(f => clear(22, f.id)); fill(22, 1, 16, 46); fill(22, 2, 18, 44);
  /* 26 — the Hangout day. Underneath, the joint-best day of the month, and the
     Hangout sits on exactly that window. Ticket 09 blanks it for everyone. */
  ALL.forEach(f => { clear(26, f.id); fill(26, f.id, 40, 46); });
  for (const day of DAYS) {
    if ([5,6,12,26].includes(day.index)) continue;
    const own = table[day.index][0];
    if (rnd() < .45) {
      const anchor = day.weekend ? 22 + Math.floor(rnd()*16) : 36 + Math.floor(rnd()*6);
      const len = 4 + Math.floor(rnd()*8);
      for (let s = anchor; s < Math.min(SPD, anchor+len); s++) own.add(s);
    } else if (rnd() < .25) own.clear();
  }
  /* two whole-day drags — month view's own gesture (ticket 01) */
  clear(19, 0); fill(19, 0, 0, 48); clear(20, 0); fill(20, 0, 0, 48);
  return table;
})();

const HANGOUTS = [
  { day: 26, from: 40, to: 46, title: 'Pizza', participants: [0,1,2,6] },
  { day: 9,  from: 38, to: 43, title: 'Aperitivo da Giulia', participants: [0,2,3,4,5,7] },
];
const hangoutFor = d => HANGOUTS.find(h => h.day === d);

function metrics(day, ids, ignoreHangout) {
  const h = ignoreHangout ? undefined : hangoutFor(day), per = SLOTS[day];
  const perSlot = []; let covered = 0; const anyone = new Set();
  for (let s = 0; s < SPD; s++) {
    const blanked = !!h && s >= h.from && s < h.to;
    let n = 0;
    for (const id of ids) if (per[id] && per[id].has(s)) { if (!blanked) n++; anyone.add(id); }
    perSlot.push(blanked ? 0 : n);
    if (!blanked && n >= 2) covered++;
  }
  const peak = perSlot.reduce((a,b) => Math.max(a,b), 0);
  const peakSlot = perSlot.indexOf(peak);
  return {
    perSlot, peak, peakSlot,
    atPeak: peak > 0 ? ids.filter(id => per[id] && per[id].has(peakSlot)) : [],
    anyone: [...anyone].sort((a,b) => a-b),
    coverage: covered / SPD,
    youFree: (per[0] ? per[0].size : 0) > 0,
    youFraction: (per[0] ? per[0].size : 0) / SPD,
    hangout: ignoreHangout ? undefined : hangoutFor(day),
  };
}

/* ------------------------------------------------------------------- state */
const S = { variant:'C', dark:false, count:5, own:'ring', dotColour:'avatar',
            overflow:'row', wash:'coverage', hangout:'marker', chrome:true, selected:null };
const NAMES = { A:'blobatar dot row', B:'peak numeral + density wash',
                C:'both, side by side', D:'where each one breaks' };
const visible = () => [0, ...OTHERS.slice(0, S.count - 1).map(f => f.id)];

/* --------------------------------------------------------------- rendering */
const el = (tag, cls, css) => { const e = document.createElement(tag);
  if (cls) e.className = cls; if (css) e.style.cssText = css; return e; };

const MIN_DOT = 12, GAP = 2, MAX_DOT = 18;

/* Language A's entire fate, in one function — see cell-dots.tsx. */
function layoutDots(ids, innerW, innerH) {
  const n = ids.length; if (!n) return { size: 0, rows: [], plus: 0, lanes: false };
  const fit = k => Math.floor((innerW - (k-1)*GAP) / k);
  if (S.overflow === 'lanes') return { size: Math.min(MAX_DOT, fit(n)), rows: [ids], plus: 0, lanes: true };
  if (S.overflow === 'wrap') {
    const rows = n <= 4 ? 1 : n <= 8 ? 2 : 3, per = Math.ceil(n / rows);
    const size = Math.min(MAX_DOT, fit(per), Math.floor((innerH - (rows-1)*GAP) / rows));
    const out = []; for (let i = 0; i < n; i += per) out.push(ids.slice(i, i+per));
    return { size, rows: out, plus: 0, lanes: false };
  }
  if (S.overflow === 'plusN') {
    if (fit(n) >= MIN_DOT) return { size: Math.min(MAX_DOT, fit(n)), rows: [ids], plus: 0, lanes: false };
    let shown = n - 1; while (shown > 1 && fit(shown + 1) < MIN_DOT) shown--;
    return { size: Math.min(MAX_DOT, fit(shown + 1)), rows: [ids.slice(0, shown)], plus: n - shown, lanes: false };
  }
  return { size: Math.min(MAX_DOT, fit(n)), rows: [ids], plus: 0, lanes: false };
}

function dotEl(id, size) {
  const f = byId(id);
  const d = el('span', 'dot', `width:${size}px;height:${size}px;background:${
    S.dotColour === 'ui' ? ui(f.hue, S.dark) : avatar(f.hue, f.tone)};`);
  d.title = `${f.name} — hue ${f.hue}, tone ${f.tone} ${toneName(f.tone)} (blobatar STAND-IN)`;
  const es = `width:${Math.max(1, size*.16)}px;height:${Math.max(1, size*.16)}px;`;
  d.appendChild(el('i', '', es)); d.appendChild(el('u', '', es));
  return d;
}

function dotsBody(m, ids, w, h) {
  if (S.overflow === 'fallback' && m.anyone.length > 5) return numeralBody(m, w, h);
  if (!m.anyone.length) return null;
  const list = S.overflow === 'lanes' ? ids : m.anyone;
  const { size, rows, plus, lanes } = layoutDots(list, w - 8, h - 20);
  const box = el('div', 'dots');
  rows.forEach((row, ri) => {
    const r = el('div', 'dotrow');
    row.forEach(id => {
      if (lanes && !m.anyone.includes(id)) r.appendChild(el('span', 'lane', `width:${size}px;height:${size}px`));
      else r.appendChild(dotEl(id, size));
    });
    if (ri === rows.length - 1 && plus > 0) {
      const p = el('span', 'plus', `width:${size}px;height:${size}px;font-size:${Math.max(7, size*.55)}px`);
      p.textContent = '+' + plus; r.appendChild(p);
    }
    box.appendChild(r);
  });
  box.dataset.dot = size;
  return box;
}

function numeralBody(m, w, h) {
  if (m.peak === 0) return null;
  const fs = Math.round(Math.min((h - 20) * .72, w * .42));
  if (m.peak === 1) {
    const s = el('span', 'num lonely', `font-size:${Math.round(fs*.42)}px`);
    s.textContent = '1';
    s.title = 'peak concurrency 1 — nobody overlaps, so this day holds no Candidate';
    return s;
  }
  const s = el('span', 'num', `font-size:${fs}px`); s.textContent = m.peak; return s;
}

const washStrength = (m, n) => S.wash === 'peak' ? (n ? m.peak / n : 0) : m.coverage;

function hangoutBorder(cell, participants) {
  const cols = participants.map(id => ui(byId(id).hue, S.dark)).join(', ');
  cell.appendChild(el('span', 'hb-glow', `box-shadow:0 0 9px -1px ${ui(byId(participants[1] ?? participants[0]).hue, S.dark, .8)}`));
  cell.appendChild(el('span', 'hb-t', `background:linear-gradient(90deg, ${cols})`));
  cell.appendChild(el('span', 'hb-b', `background:linear-gradient(270deg, ${cols})`));
  cell.appendChild(el('span', 'hb-l', `background:linear-gradient(0deg, ${cols})`));
  cell.appendChild(el('span', 'hb-r', `background:linear-gradient(180deg, ${cols})`));
  const row = el('span', 'hblobs');
  const sz = Math.max(5, Math.floor((78 - 14) / participants.length) - 1);
  participants.forEach(id => row.appendChild(dotEl(id, sz)));
  cell.appendChild(row);
}
function hangoutMarker(cell, title) {
  const m = el('span', 'hm'); m.appendChild(el('b'));
  const s = el('span'); s.textContent = title; m.appendChild(s); cell.appendChild(m);
}

/* One cell, either language. `opts` overrides state for the probe cards. */
function cellEl(day, m, ids, kind, w, h, opts) {
  const o = Object.assign({ own: S.own, hangout: S.hangout, today: false, sel: false, chrome: S.chrome }, opts || {});
  const cell = el('div', 'cell', `width:${w}px;height:${h}px`);
  if (kind === 'numeral') {
    cell.appendChild(el('span', 'wash', `background:${wash(washStrength(m, ids.length), S.dark)}`));
    if (m.coverage > 0)
      cell.appendChild(el('span', 'cov', `width:${Math.max(4, m.coverage*100)}%;background:${ui(VIEWER.hue, S.dark, .85)}`));
  }
  const isToday = o.chrome && o.today, pill = o.own === 'datepill' && m.youFree;
  const dt = el('span', 'date' + (isToday ? ' today' : pill ? ' pill' : ''),
    pill ? `background:${ui(VIEWER.hue, S.dark)}` : '');
  dt.textContent = DAYS[day].date; cell.appendChild(dt);

  const body = el('span', 'body');
  const node = kind === 'dots' ? dotsBody(m, ids, w, h) : numeralBody(m, w, h);
  if (node) body.appendChild(node);
  cell.appendChild(body);
  if (node && node.dataset && +node.dataset.dot < MIN_DOT) {
    const bad = el('span', 'toosmall'); bad.textContent = node.dataset.dot;
    bad.title = `dot is ${node.dataset.dot}px — below the ${MIN_DOT}px at which a blobatar shape reads`;
    cell.appendChild(bad);
  }

  if (m.youFree && o.own === 'ring')
    cell.appendChild(el('span', 'own-ring', `box-shadow:inset 0 0 0 2px ${ui(VIEWER.hue, S.dark)}, inset 0 0 0 4px ${ui(VIEWER.hue, S.dark, .28)}`));
  if (m.youFree && o.own === 'underline')
    cell.appendChild(el('span', 'own-under', `width:${Math.max(12, m.youFraction*100)}%;background:${ui(VIEWER.hue, S.dark)}`));
  if (m.youFree && o.own === 'corner')
    cell.appendChild(el('span', 'own-corner', `border-top:9px solid ${ui(VIEWER.hue, S.dark)};border-left:9px solid transparent`));

  const h0 = o.forceHangout || m.hangout;
  if (h0 && o.hangout !== 'off') {
    if (o.hangout === 'marker') hangoutMarker(cell, h0.title);
    else hangoutBorder(cell, h0.participants);
  }
  if (o.chrome && o.sel) cell.appendChild(el('span', 'sel'));
  cell.title = `day ${DAYS[day].date} · peak ${m.peak} · ${m.anyone.length} with Availability · coverage ${Math.round(m.coverage*100)}%`;
  return cell;
}

function monthGrid(kind, label) {
  const ids = visible(), wrap = el('div');
  const lab = el('div', 'gridlab'); lab.innerHTML = `${label}<span>September 2026 · 78×72px cells</span>`;
  wrap.appendChild(lab);
  const g = el('div', 'month', 'grid-template-columns:repeat(7, 78px)');
  WEEKDAYS.forEach(d => { const c = el('div', 'wd'); c.textContent = d; g.appendChild(c); });
  DAYS.forEach(day => {
    const m = metrics(day.index, ids);
    const c = cellEl(day.index, m, ids, kind, 78, 72,
      { today: day.index === TODAY, sel: day.index === S.selected });
    if (day.index % 7 === 0) c.classList.add('c0');
    if (!day.inMonth) c.style.opacity = '.45';
    c.onclick = () => { S.selected = S.selected === day.index ? null : day.index; render(); };
    c.style.cursor = 'pointer';
    g.appendChild(c);
  });
  wrap.appendChild(g);
  return wrap;
}

function panel() {
  if (S.selected === null) return null;
  const ids = visible(), m = metrics(S.selected, ids);
  const p = el('div', '', 'width:240px;flex:none;border:1px solid var(--border);border-radius:8px;padding:12px;font-size:11px');
  let html = `<div style="font-weight:600;margin-bottom:6px">${DAYS[S.selected].date} September</div>`;
  if (m.hangout) html += `<div style="background:var(--muted);border-radius:6px;padding:7px;margin-bottom:7px"><b>Hangout · ${m.hangout.title}</b><br><span style="color:var(--mutedfg)">${fmtSlot(m.hangout.from)}–${fmtSlot(m.hangout.to)} · ${m.hangout.participants.length} Participants</span></div>`;
  html += `<div style="color:var(--mutedfg);margin-bottom:7px">peak ${m.peak} at ${fmtSlot(Math.max(0, m.peakSlot))} · ${Math.round(m.coverage*100)}% of the day has 2+ free</div>`;
  html += m.anyone.length
    ? m.anyone.map(id => `<div style="display:flex;align-items:center;gap:7px;margin-bottom:5px"><span class="dot" style="width:18px;height:18px;background:${avatar(byId(id).hue, byId(id).tone)}"></span>${byId(id).name}${m.atPeak.includes(id) ? '<span style="margin-left:auto;font-size:9px;color:var(--mutedfg)">at peak</span>' : ''}</div>`).join('')
    : '<span style="color:var(--mutedfg)">Nobody has drawn Availability.</span>';
  html += `<div style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px;font-size:10px;color:var(--mutedfg)">At 8 Friends this panel is ~${80 + 8*26}px tall and 240px wide — three month columns. It cannot sit beside the cell the way the week view's does.</div>`;
  p.innerHTML = html;
  return p;
}

function card(cap, node) {
  const c = el('div', 'card');
  const t = el('div', 'cap'); t.textContent = cap; c.appendChild(t); c.appendChild(node); return c;
}
function std(inner) { const b = el('div', 'std'); b.appendChild(inner); return b; }
function note(html) { const n = el('div', 'note'); n.innerHTML = html; return n; }
function section(title, ...kids) {
  const s = el('section'); const h = el('h2'); h.textContent = title; s.appendChild(h);
  kids.forEach(k => k && s.appendChild(k)); return s;
}

/* ----------------------------------------------------------- probe D1..D4 */
function twinProbe() {
  const ids = visible(), box = el('div', '', 'display:flex;flex-direction:column;gap:14px');
  [[5, 'Sat 5 — everyone free, nobody together'], [6, 'Sun 6 — everyone free, all at once']].forEach(([d, label]) => {
    const m = metrics(d, ids), row = el('div', '', 'display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap');
    const left = el('div', '', 'width:200px');
    left.innerHTML = `<div style="font-weight:500;margin-bottom:4px">${label}</div>`;
    const tl = el('div', 'tl');
    m.perSlot.forEach((n, s) => { if (n > 0) tl.appendChild(el('i', '',
      `left:${s/SPD*100}%;width:${100/SPD}%;background:${ui(VIEWER.hue, S.dark, .15 + .75*(n/Math.max(1, ids.length)))}`)); });
    left.appendChild(tl);
    const cap = el('div', '', 'font-size:10px;color:var(--mutedfg);margin-top:4px');
    cap.textContent = `peak ${m.peak} · ${m.anyone.length} with Availability · coverage ${Math.round(m.coverage*100)}%`;
    left.appendChild(cap); row.appendChild(left);
    row.appendChild(card('dots', cellEl(d, m, ids, 'dots', 78, 72, { own:'none', hangout:'off', chrome:false })));
    row.appendChild(card('numeral', cellEl(d, m, ids, 'numeral', 78, 72, { own:'none', hangout:'off', chrome:false })));
    box.appendChild(row);
  });
  const b = metrics(6, ids);
  box.appendChild(note(`The same ${ids.length} Friends have Availability on both days. On the 5th not one pair overlaps, so there is <b>no Candidate at all</b>; on the 6th they are all free in the same two hours. The dot rows are <b>identical</b>. The numeral is 1 versus ${b.peak}. A dot row does not answer the question the month view is asked.`));
  return box;
}

function edgeProbe() {
  const ids = visible(), row = el('div', 'probe');
  const cases = [
    ['plain', 12, { own:'none', hangout:'off' }],
    ['yours (ring)', 12, { own:'ring', hangout:'off' }],
    ['yours + today', 12, { own:'ring', hangout:'off', today:true }],
    ['yours + today + selected', 12, { own:'ring', hangout:'off', today:true, sel:true }],
    ['…+ Hangout glow', 26, { own:'ring', hangout:'blobs', today:true, sel:true }],
    ['yours as underline', 26, { own:'underline', hangout:'blobs', today:true, sel:true }],
    ['yours as date pill', 26, { own:'datepill', hangout:'blobs', sel:true }],
  ];
  cases.forEach(([cap, day, o]) => {
    const m = metrics(day, ids);
    row.appendChild(card(cap, cellEl(day, m, ids, 'numeral', 78, 72, Object.assign({ chrome:true }, o))));
  });
  const box = el('div'); box.appendChild(row);
  box.appendChild(note(`Ticket 15 paid for "your own Availability" with a border and a ring because a week column's edge was free. A month cell's edge carries the grid rule, <b>today</b>, the <b>selected</b> day and a <b>Hangout's glow</b>. By the fifth card there are four concentric rings on a 78×72 box and none of them is readable. The occlusion problem does not recur — <b>ticket 15's fix does not transfer</b>.`));
  return box;
}

const LADDER = [[120,104,'desktop, roomy'],[96,88,'desktop, tight'],[78,72,'the ticket’s 78×72'],[64,58,'small laptop'],[46,44,'mobile month']];
function ladderProbe() {
  const ids = visible(), m = metrics(12, ids), row = el('div', 'ladder');
  LADDER.forEach(([w, h, label]) => {
    const c = el('div');
    const t = el('div', '', 'font-size:10px;color:var(--mutedfg);margin-bottom:4px');
    t.textContent = `${w}×${h} · ${label}`; c.appendChild(t);
    const pair = el('div', '', 'display:flex;gap:8px');
    [['dots'], ['numeral']].forEach(([k]) => {
      const b = el('div', '', `position:relative;width:${w}px;height:${h}px;border:1px solid var(--border);border-radius:5px`);
      b.appendChild(cellEl(12, m, ids, k, w, h, { own:'none', hangout:'off', chrome:false }));
      b.firstChild.style.border = '0'; b.firstChild.style.position = 'absolute';
      b.firstChild.style.inset = '0'; b.firstChild.style.width = 'auto'; b.firstChild.style.height = 'auto';
      pair.appendChild(b);
    });
    c.appendChild(pair);
    const size = layoutDots(m.anyone, w - 8, h - 20).size;
    const l = el('div', '', `font-size:10px;margin-top:4px;${size < MIN_DOT ? 'color:#ef4444;font-weight:600' : 'color:var(--mutedfg)'}`);
    l.textContent = `dot ${size}px`; c.appendChild(l);
    row.appendChild(c);
  });
  return row;
}

function hangoutProbe() {
  const ids = visible(), box = el('div'), row = el('div', 'probe');
  ['blobs','marker','off'].forEach(mode => {
    const g = el('div');
    const t = el('div', '', 'font-size:10px;color:var(--mutedfg);margin-bottom:5px');
    t.textContent = mode === 'off' ? 'no Hangout treatment' : mode; g.appendChild(t);
    const pair = el('div', '', 'display:flex;gap:10px');
    [26, 9].forEach(d => {
      const m = metrics(d, ids), hh = hangoutFor(d), c = el('div');
      c.appendChild(cellEl(d, m, ids, 'numeral', 78, 72, { own:'none', hangout:mode, chrome:false, forceHangout:hh }));
      const cap = el('div', '', 'font-size:9px;color:var(--mutedfg);width:78px;line-height:1.3;margin-top:4px');
      cap.textContent = `${hh.title} · ${hh.participants.length}p · peak ${m.peak} · underneath ${metrics(d, ids, true).peak}`;
      c.appendChild(cap); pair.appendChild(c);
    });
    g.appendChild(pair); row.appendChild(g);
  });
  box.appendChild(row);
  const m26 = metrics(26, ids), bare = metrics(26, ids, true);
  box.appendChild(note(`Both days were among the best in the month before the Hangout landed on them. Ticket 09 blanks a Hangout's slots for everyone, so the 26th's peak numeral reads <b>${m26.peak}</b> where the day underneath is <b>${bare.peak}</b> — the cell says "nothing here" about the busiest day of the month. A Hangout marker is therefore <b>mandatory, not decorative</b>: without it, language B renders its own best day as blank. The dot row is <b>immune</b> — Availability still exists under a Hangout, so language A shows the same dots either way. And the glow bleeds past the cell edge: month cells share borders, so it lands on the neighbours.`));
  return box;
}

function legend() {
  const ids = visible(), row = el('div', 'legend');
  ids.forEach(id => {
    const f = byId(id), d = el('div');
    d.innerHTML = `<span class="dot" style="width:24px;height:24px;background:${avatar(f.hue, f.tone)}"></span>
      <div><div style="font-weight:500">${f.name}</div><div style="font-size:10px;color:var(--mutedfg)">hue ${f.hue} · ${toneName(f.tone)} · ${f.note}</div></div>
      <span class="swatch" style="background:${ui(f.hue, S.dark)}" title="ticket 11 UI colour"></span>`;
    row.appendChild(d);
  });
  const box = el('div'); box.appendChild(row);
  box.appendChild(note(`The small circle on the right is the ticket 11 <b>UI</b> colour, <code>oklch(L_theme, C_theme, hue)</code>; the big one is the <b>avatar</b> colour from blobatar's tone ramp. Elena (<code>pale neutral</code>, l .90) all but vanishes on a light calendar and Teo (<code>ink</code>, l .34) on a dark one — switch <b>dots</b> to <code>ui</code> to see them come back, at the cost of the dot no longer looking like the person's avatar.`));
  return box;
}

/* ----------------------------------------------------------------- chrome */
const CONTROLS = [
  ['friends', 'count', [3,5,8]],
  ['yours', 'own', ['ring','underline','datepill','corner','none']],
  ['dots', 'dotColour', ['avatar','ui']],
  ['overflow', 'overflow', ['row','plusN','wrap','lanes','fallback']],
  ['wash', 'wash', ['coverage','peak']],
  ['hangout', 'hangout', ['blobs','marker','off']],
  ['theme', 'dark', [false, true], v => v ? 'dark' : 'light'],
];
function renderBar() {
  const bar = document.getElementById('bar'); bar.innerHTML = '';
  CONTROLS.forEach(([label, key, vals, fmt]) => {
    const g = el('div', 'grp'); const b = el('b'); b.textContent = label; g.appendChild(b);
    const p = el('div', 'pills');
    vals.forEach(v => { const btn = el('button', S[key] === v ? 'on' : '');
      btn.textContent = fmt ? fmt(v) : v; btn.onclick = () => { S[key] = v; render(); }; p.appendChild(btn); });
    g.appendChild(p); bar.appendChild(g);
  });
  const g = el('div', 'grp'); const b = el('b'); b.textContent = 'chrome'; g.appendChild(b);
  const p = el('div', 'pills'); const btn = el('button', S.chrome ? 'on' : '');
  btn.textContent = 'today+sel'; btn.onclick = () => { S.chrome = !S.chrome; render(); };
  p.appendChild(btn); g.appendChild(p); bar.appendChild(g);
}

function render() {
  document.body.className = S.dark ? 'dark' : 'light';
  document.getElementById('vname').textContent = `${S.variant} · ${NAMES[S.variant]}`;
  renderBar();
  const out = document.getElementById('out'); out.innerHTML = '';
  const withPanel = grid => { const r = el('div', 'rowwrap'); r.appendChild(grid);
    const p = panel(); if (p) r.appendChild(p); return r; };

  if (S.variant === 'A') out.appendChild(section('A · blobatar dot row — who is around this month',
    withPanel(monthGrid('dots', 'A · dots')),
    note('Identity is preserved and time is thrown away entirely. Compare the 5th and the 6th (variant D, first probe): identical rows, opposite days. Set <b>friends</b> to 8 and watch the red dot-size badge.')));

  if (S.variant === 'B') out.appendChild(section('B · peak numeral over a density wash — where the good days are',
    withPanel(monthGrid('numeral', 'B · numeral + wash')),
    note('The numeral is O(1) in Friends — 8 renders exactly as well as 3. The wash is the viewer\'s own hue on ticket 15\'s ramp. Flip <b>wash</b> between <code>coverage</code> and <code>peak</code>: only one of the two agrees with what opacity means in the week grid.')));

  if (S.variant === 'C') {
    const r = el('div', 'rowwrap');
    r.appendChild(monthGrid('dots', 'A · dots'));
    r.appendChild(monthGrid('numeral', 'B · numeral + wash'));
    const p = panel(); if (p) r.appendChild(p);
    out.appendChild(section('C · the same month, both languages, same data', r,
      note('Scan each grid for "when should we do something". In B the answer is a number you read without stopping. In A you have to count dots — and counting dots gives you the wrong answer, because a dot means "has Availability today", not "is free at the same time as anyone else".')));
  }

  if (S.variant === 'D') {
    out.appendChild(section('D1 · the twin days — the dot row’s blind spot', twinProbe()));
    out.appendChild(section('D2 · the edge is already spoken for — item 3', edgeProbe()));
    out.appendChild(section('D3 · the size ladder — where each language dies', ladderProbe()));
    out.appendChild(section('D4 · Hangouts in a cell — item 4', hangoutProbe()));
  }

  out.appendChild(section('Who is in this month', legend()));
}

const ORDER = ['A','B','C','D'];
const step = d => { S.variant = ORDER[(ORDER.indexOf(S.variant) + d + 4) % 4];
  const u = new URL(location.href); u.searchParams.set('variant', S.variant);
  history.replaceState(null, '', u); render(); };
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
addEventListener('keydown', e => {
  const t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1);
});
S.variant = (new URLSearchParams(location.search).get('variant') || 'C').toUpperCase();
if (!ORDER.includes(S.variant)) S.variant = 'C';
render();
    </script>
  </body>
</html>
